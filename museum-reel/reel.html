<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15초 브랜드 쇼릴 템플릿</title>
<style>
  :root{
    --navy:#224FA3; --navy-deep:color-mix(in srgb, var(--navy) 50%, #06101F); --ink:#0B1226; --teal:#49A5BF;
    --white:#FFFFFF; --accent:#FFB800;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:var(--white);
    font-family:"Paperlogy","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}

  .stage{position:relative;width:min(100vw - 32px, 1280px);aspect-ratio:16/9;overflow:hidden;
    background:var(--navy-deep);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .45s}
  .scene.on{opacity:1;visibility:visible}
  .scene.out{opacity:0}

  .photo{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.12);background-color:var(--navy-deep)}
  .on .photo{animation:kb 4s ease-out forwards}
  @keyframes kb{to{transform:scale(1.0)}}
  .shade{position:absolute;inset:0;background:linear-gradient(115deg,rgba(11,18,38,.92) 0%,rgba(19,44,92,.72) 55%,rgba(11,18,38,.6) 100%)}
  .grid{position:absolute;inset:0;background-image:
      linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 40%,transparent 80%)}

  .kicker{font-size:clamp(12px,1.4vw,20px);letter-spacing:.35em;text-transform:uppercase;color:var(--teal);font-weight:700}
  .h1{font-size:clamp(34px,7vw,104px);font-weight:900;line-height:1.05;letter-spacing:-.02em;text-shadow:0 8px 40px rgba(0,0,0,.5)}
  .h2{font-size:clamp(22px,3.6vw,52px);font-weight:800;line-height:1.2}
  .sub{font-size:clamp(14px,1.8vw,26px);color:rgba(255,255,255,.82)}
  .rise{opacity:0;transform:translateY(40px)}
  .on .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .d1{animation-delay:.15s!important}.d2{animation-delay:.35s!important}.d3{animation-delay:.55s!important}.d4{animation-delay:.75s!important}

  .s1 .box{position:relative;text-align:center;z-index:2}
  .plate{display:inline-block;background:var(--white);border-radius:16px;padding:3% 5%;
    box-shadow:0 30px 80px rgba(0,0,0,.45);clip-path:inset(0 100% 0 0)}
  .on .plate{animation:reveal .9s .3s cubic-bezier(.7,0,.2,1) forwards}
  @keyframes reveal{to{clip-path:inset(0 0 0 0)}}
  .plate img{display:block;max-width:min(56vw,640px);max-height:min(22vw,200px);height:auto}
  .plate.noimg{display:none}
  .plate.dark{background:var(--navy-deep);border:1px solid rgba(255,255,255,.25)}   /* 흰색 로고용 (SPEC.logoOnDark) */
  .s1 .bar{width:0;height:6px;background:var(--accent);margin:22px auto 0;border-radius:3px}
  .s1.on .bar{animation:grow .8s 1.1s cubic-bezier(.7,0,.2,1) forwards}
  @keyframes grow{to{width:min(40%,320px)}}

  .strips{position:absolute;inset:-10% 0;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2%;padding:0 3%}
  .col{display:flex;flex-direction:column;gap:2.4%}
  .col img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;opacity:.55;filter:saturate(.9);background:rgba(255,255,255,.06)}
  .on .col.up{animation:slideUp 7s linear forwards}
  .on .col.down{animation:slideDown 7s linear forwards}
  @keyframes slideUp{from{transform:translateY(6%)}to{transform:translateY(-14%)}}
  @keyframes slideDown{from{transform:translateY(-16%)}to{transform:translateY(4%)}}
  .s2 .shade{background:linear-gradient(180deg,rgba(11,18,38,.55),rgba(11,18,38,.85))}
  .s2 .words{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:.25em .4em;justify-content:center;max-width:82%;text-align:center;
    text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .s2 .w{display:inline-block;opacity:0;transform:translateY(30px) rotate(-2deg)}
  .s2.on .w{animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
  .s2 .w.hl{color:var(--accent)}

  .s3 .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;width:92%}
  .cards{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:1.4%;width:100%}
  .dcard{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;opacity:0;transform:translateY(60px) scale(.9);
    box-shadow:0 18px 50px rgba(0,0,0,.45);background:linear-gradient(160deg,var(--navy),var(--navy-deep))}
  .s3.on .dcard{animation:cardin .6s cubic-bezier(.2,1.2,.3,1) forwards}
  .dcard:nth-child(1){animation-delay:.15s}.dcard:nth-child(2){animation-delay:.35s}.dcard:nth-child(3){animation-delay:.55s}
  .dcard:nth-child(4){animation-delay:.75s}.dcard:nth-child(5){animation-delay:.95s}.dcard:nth-child(6){animation-delay:1.15s}
  @keyframes cardin{to{opacity:1;transform:none}}
  .dcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.15)}
  .s3.on .dcard img{animation:kb 4s ease-out forwards}
  .dcard .lab{position:absolute;left:0;right:0;bottom:0;padding:14% 7% 8%;font-weight:800;font-size:clamp(11px,1.5vw,22px);line-height:1.2;
    word-break:keep-all;overflow-wrap:anywhere;background:linear-gradient(180deg,transparent,rgba(11,18,38,.95))}

  .s4 .cols{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:6%;width:84%;align-items:center}
  .num{font-size:clamp(56px,12vw,180px);font-weight:900;line-height:.95;color:var(--accent);letter-spacing:-.04em;text-shadow:0 10px 40px rgba(0,0,0,.5)}
  .num small{font-size:.35em;color:var(--white);margin-left:.15em;letter-spacing:0}
  .card{border-left:6px solid var(--teal);padding-left:5%}
  .card .h2{margin-bottom:.3em}

  .s5 .box{position:relative;z-index:2;text-align:center}
  .s5 .mark{width:clamp(56px,7vw,96px);height:auto;border-radius:14px;background:#fff;padding:8px;display:block;margin:0 auto 14px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .s5 .mark.noimg{display:none}
  .s5 .url{font-size:clamp(28px,5.5vw,84px);font-weight:900;letter-spacing:.02em}
  .s5 .url span{color:var(--teal)}
  .s5 .ring{position:absolute;left:50%;top:50%;width:20px;height:20px;border:3px solid var(--teal);border-radius:50%;
    transform:translate(-50%,-50%);opacity:0;z-index:1}
  .s5.on .ring{animation:ring 1.6s ease-out .2s 2}
  @keyframes ring{0%{opacity:.9;width:20px;height:20px}100%{opacity:0;width:140vmin;height:140vmin}}
  .s5 .photo{filter:blur(3px)}

  .progress{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--accent);z-index:5}
  .stamp{position:absolute;right:18px;top:14px;font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.6);z-index:5}
  .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:#B9C4DA;font-size:14px}
  button{font:inherit;font-weight:700;padding:.55em 1.2em;border-radius:8px;border:1px solid #33518F;background:#16264B;color:#fff;cursor:pointer}
  button:hover{background:#1E3466}
  input[type=range]{width:min(50vw,480px);accent-color:var(--accent)}
  .tc{font-variant-numeric:tabular-nums;min-width:5.5em;text-align:center}
  .note{max-width:1280px;color:#8FA0C4;font-size:13px;line-height:1.6;text-align:center}

  /* SPEC 편집 서랍 */
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100vw);background:#0F1A33;border-left:1px solid #26407A;
    transform:translateX(100%);transition:transform .3s;z-index:50;display:flex;flex-direction:column;padding:16px;gap:10px}
  .drawer.open{transform:none}
  .drawer h3{font-size:15px;color:#CFE0FF;display:flex;justify-content:space-between;align-items:center}
  .drawer textarea{flex:1;width:100%;font:13px/1.45 Consolas,"D2Coding",monospace;background:#0A1226;color:#DDE7FF;border:1px solid #26407A;border-radius:8px;padding:10px;resize:none}
  .drawer .row{display:flex;gap:8px;flex-wrap:wrap}
  .drawer .msg{font-size:12px;color:#8FA0C4;min-height:1.2em}
  .drawer .msg.err{color:#FF8A80}
</style>
</head>
<body>

<div class="stage" id="stage" aria-label="15초 브랜드 쇼릴">
  <div class="stamp" id="stamp">15s SHOWREEL</div>

  <section class="scene s1" data-in="0" data-out="2.8">
    <div class="photo" id="bg-s1"></div><div class="shade"></div><div class="grid"></div>
    <div class="box">
      <div class="kicker rise" id="t-kicker1"></div>
      <div class="plate" id="plate" style="margin-top:18px"><img id="img-logo" alt="로고"></div>
      <div class="h1 rise d2" id="t-name" hidden></div>
      <div class="bar"></div>
    </div>
  </section>

  <section class="scene s2" data-in="2.8" data-out="6">
    <div class="strips" id="strips"></div><div class="shade"></div>
    <div class="words h2" id="t-slogan"></div>
  </section>

  <section class="scene s3" data-in="6" data-out="9.8">
    <div class="grid"></div>
    <div class="wrap">
      <div class="kicker rise" id="t-deptkicker"></div>
      <div class="cards" id="t-depts"></div>
    </div>
  </section>

  <section class="scene s4" data-in="9.8" data-out="12.6">
    <div class="photo" id="bg-s4"></div><div class="shade"></div>
    <div class="cols">
      <div class="rise"><div class="num" id="t-num"></div><div class="sub" id="t-numsub"></div></div>
      <div class="card rise d3"><div class="h2" id="t-fact1"></div><div class="sub" id="t-fact2"></div></div>
    </div>
  </section>

  <section class="scene s5" data-in="12.6" data-out="15">
    <div class="photo" id="bg-s5"></div><div class="shade"></div><div class="ring"></div>
    <div class="box">
      <img class="mark rise" id="img-mark" alt="심볼">
      <div class="kicker rise d1" id="t-ctakicker"></div>
      <div class="url rise d2" id="t-url"></div>
      <div class="sub rise d4" id="t-contact"></div>
    </div>
  </section>

  <div class="progress" id="bar"></div>
</div>

<div class="ctl">
  <button id="play">처음부터 재생</button>
  <button id="pause">일시정지</button>
  <input type="range" id="seek" min="0" max="15" step="0.05" value="0">
  <span class="tc" id="tc">0.00 / 15.00</span>
  <button id="edit">SPEC 편집</button>
</div>
<p class="note" id="note">주소 뒤 #spec= 에 실린 분석 결과(SPEC)를 읽어 재생한다. SPEC이 없으면 국립중앙박물관 시안을 보여 준다.<br>
로고·사진은 원본 사이트 자산이다. 시안은 내부 확인용이며 외부 게시 전 해당 기관의 허가가 필요하다.</p>

<aside class="drawer" id="drawer">
  <h3>SPEC 편집 <button id="close">닫기</button></h3>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="row">
    <button id="apply">적용</button>
    <button id="copyUrl">공유 주소 복사</button>
    <button id="copyJson">JSON 복사</button>
    <button id="reset">견본으로</button>
  </div>
  <div class="msg" id="msg">문구·사진 주소를 고친 뒤 적용. 적용하면 주소창의 #spec도 갱신된다.</div>
</aside>

<script>
/* ───────── 0. 견본 SPEC (국립중앙박물관, 2026-09-29 수집 · 문구는 메인 페이지 원문) ───────── */
const DEMO = {
  source:{url:"https://www.museum.go.kr/MUSEUM/main/index.do", collectedAt:"2026-09-29"},
  name:"국립중앙박물관", logo:"assets/logo.png", mark:"assets/mark.png",
  photos:{hero:"assets/v_chusa.jpg", people:"assets/v_painting.jpg",
    strip:["assets/v_treasure.jpg","assets/v_table.jpg","assets/v_bamboo.png","assets/v_painting.jpg",
           "assets/v_chusa.jpg","assets/b_children.jpg","assets/v_treasure.jpg","assets/v_bamboo.png","assets/v_painting.jpg"]},
  kicker:"NATIONAL MUSEUM OF KOREA",
  sloganWords:["국보순회전,","우리","동네에서","만나는","보물"], sloganHighlight:["보물"],
  deptKicker:"현재전시 · 예정전시 특별전",
  depts:[{name:"우리들의 밥상",img:"assets/p_table.jpg"},{name:"추사 김정희와 그의 동반자",img:"assets/p_chusa.jpg"},
         {name:"금관의 나라",img:"assets/p_crown.jpg"},{name:"모던 아트의 탄생",img:"assets/p_modern.jpg"},
         {name:"마리 앙투아네트 스타일",img:"assets/p_marie.jpg"}],
  bigNumber:"21:00", bigUnit:"", bigSub:"수/토 관람시간 09:30 ~ 21:00",
  fact1:"관람료 무료", fact2:"특별전시는 유료 · 월/화/목/금/일 09:30 ~ 17:30",
  ctaKicker:"오시는길 · 예약하기", url:["museum",".go.kr"], contact:"서울시 용산구 서빙고로 137 · 대표전화 02-2077-9000",
  theme:{navy:"#3A3F58", teal:"#C9A36B", accent:"#E8B04B"}
};

/* ───────── 1. SPEC 읽기: #spec=base64url(JSON) → localStorage → 견본 ───────── */
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/") + "=".repeat((4 - s.length % 4) % 4))));
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function loadSpec(){
  const m = location.hash.match(/spec=([^&]+)/);
  if (m){ try { return JSON.parse(b64d(m[1])); } catch(e){ console.warn("spec 해석 실패", e); } }
  try { const s = localStorage.getItem("reelSpec"); if (s) return JSON.parse(s); } catch(e){}
  return DEMO;
}
function normalize(s){
  const d = JSON.parse(JSON.stringify(DEMO));
  const o = Object.assign({}, s);
  o.name = o.name || "기관명";
  o.photos = Object.assign({hero:"",people:"",strip:[]}, o.photos||{});
  o.sloganWords = (o.sloganWords && o.sloganWords.length) ? o.sloganWords : [o.name];
  o.sloganHighlight = o.sloganHighlight || [];
  o.depts = (o.depts||[]).filter(x=>x && x.name).slice(0,6);
  o.url = o.url || [location.hostname, ""];
  o.theme = Object.assign({}, d.theme, o.theme||{});
  o.kicker = o.kicker || (o.source && o.source.url ? new URL(o.source.url).hostname.replace(/^www\./,"").toUpperCase() : "SHOWREEL");
  return o;
}

/* ───────── 2. SPEC → 화면 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(spec){
  const S = normalize(spec);
  const r = document.documentElement.style;
  if (S.theme.navy) r.setProperty("--navy", S.theme.navy);
  if (S.theme.teal) r.setProperty("--teal", S.theme.teal);
  if (S.theme.accent) r.setProperty("--accent", S.theme.accent);
  document.title = `${S.name} 15초 브랜드 쇼릴`;
  $("#stamp").textContent = `${S.kicker} · 15s SHOWREEL`;
  $("#t-kicker1").textContent = S.kicker;
  // 로고가 없으면 기관명을 큰 글자로
  const logo = $("#img-logo"); logo.onerror = () => { $("#plate").classList.add("noimg"); $("#t-name").hidden = false; };
  $("#plate").classList.toggle("noimg", !S.logo); $("#plate").classList.toggle("dark", !!S.logoOnDark);
  $("#t-name").hidden = !!S.logo; $("#t-name").textContent = S.name;
  $("#img-mark").style.background = S.logoOnDark ? "var(--navy-deep)" : "#fff";
  if (S.logo) logo.src = S.logo;
  const mark = $("#img-mark"); mark.onerror = () => mark.classList.add("noimg");
  mark.classList.toggle("noimg", !(S.mark||S.logo)); if (S.mark||S.logo) mark.src = S.mark||S.logo;
  ["s1","s4","s5"].forEach(k => { const img = k==="s4" ? (S.photos.people||S.photos.hero) : S.photos.hero;
    $("#bg-"+k).style.backgroundImage = img ? `url("${img}")` : "none"; });
  const P = S.photos.strip.length ? S.photos.strip : [S.photos.hero, S.photos.people].filter(Boolean);
  $("#strips").innerHTML = P.length ? [0,1,2].map(c =>
    `<div class="col ${c%2?'down':'up'}">${[0,1,2,3].map(r=>`<img src="${esc(P[(c*3+r)%P.length])}" alt="" onerror="this.style.visibility='hidden'">`).join("")}</div>`).join("") : "";
  $("#t-slogan").innerHTML = S.sloganWords.map((w,i)=>
    `<span class="w ${S.sloganHighlight.includes(w)?'hl':''}" style="animation-delay:${.15+i*.22}s">${esc(w)}</span>`).join("");
  $("#t-deptkicker").textContent = S.deptKicker || "";
  $("#t-depts").style.setProperty("--n", Math.max(S.depts.length,1));
  $("#t-depts").innerHTML = S.depts.map(d=>
    `<div class="dcard">${d.img?`<img src="${esc(d.img)}" alt="" onerror="this.remove()">`:""}<div class="lab">${esc(d.name)}</div></div>`).join("");
  $("#t-num").innerHTML = S.bigNumber ? `${esc(S.bigNumber)}<small>${esc(S.bigUnit||"")}</small>` : `<small>${esc(S.name)}</small>`;
  $("#t-numsub").textContent = S.bigSub || "";
  $("#t-fact1").textContent = S.fact1 || ""; $("#t-fact2").textContent = S.fact2 || "";
  $("#t-ctakicker").textContent = S.ctaKicker || "";
  $("#t-url").innerHTML = `${esc(S.url[0])}<span>${esc(S.url[1]||"")}</span>`;
  $("#t-contact").textContent = S.contact || "";
  return S;
}

/* ───────── 3. 15초 타임라인 ───────── */
const DUR = 15, scenes = [...document.querySelectorAll(".scene")];
let t0 = null, paused = false, raf = null, current = null;
function show(sc){ if (current === sc) return; if (current){ current.classList.remove("on"); current.classList.add("out"); }
  current = sc; if (sc){ sc.classList.remove("out"); void sc.offsetWidth; sc.classList.add("on"); } }
function tick(t){ const sc = scenes.find(s => t >= +s.dataset.in && t < +s.dataset.out) || scenes[scenes.length-1];
  show(sc); $("#bar").style.width = (t/DUR*100)+"%"; $("#seek").value = t; $("#tc").textContent = t.toFixed(2)+" / 15.00"; }
function loop(now){ if (paused) return; const t = Math.min(DUR,(now-t0)/1000); tick(t); if (t<DUR) raf = requestAnimationFrame(loop); else paused = true; }
function playFrom(sec){ cancelAnimationFrame(raf); paused = false; scenes.forEach(s=>s.classList.remove("on","out")); current=null;
  t0 = performance.now() - sec*1000; raf = requestAnimationFrame(loop); }
window.seek = sec => { cancelAnimationFrame(raf); paused = true; scenes.forEach(s=>s.classList.remove("on","out")); current=null; tick(sec); };
$("#play").onclick = () => playFrom(0);
$("#pause").onclick = () => { if (paused) playFrom(+$("#seek").value); else { paused = true; cancelAnimationFrame(raf); } };
$("#seek").oninput = e => seek(+e.target.value);
document.addEventListener("keydown", e => { if (e.code==="Space" && e.target.tagName!=="TEXTAREA"){ e.preventDefault(); $("#pause").click(); } });

/* ───────── 4. SPEC 편집 서랍 ───────── */
let SPEC = loadSpec();
const ta = $("#ta"), msg = $("#msg");
function setMsg(t, err){ msg.textContent = t; msg.classList.toggle("err", !!err); }
$("#edit").onclick = () => { ta.value = JSON.stringify(SPEC, null, 2); $("#drawer").classList.add("open"); };
$("#close").onclick = () => $("#drawer").classList.remove("open");
$("#apply").onclick = () => { try { SPEC = JSON.parse(ta.value); } catch(e){ return setMsg("JSON 오류: "+e.message, true); }
  location.hash = "spec=" + b64e(JSON.stringify(SPEC)); try{ localStorage.setItem("reelSpec", JSON.stringify(SPEC)); }catch(e){}
  start(); setMsg("적용 완료. 주소창의 #spec 갱신."); };
$("#copyUrl").onclick = async () => { await navigator.clipboard.writeText(location.href); setMsg("공유 주소를 복사했다."); };
$("#copyJson").onclick = async () => { await navigator.clipboard.writeText(JSON.stringify(SPEC, null, 2)); setMsg("JSON을 복사했다."); };
$("#reset").onclick = () => { SPEC = JSON.parse(JSON.stringify(DEMO)); ta.value = JSON.stringify(SPEC,null,2); history.replaceState(null,"",location.pathname); try{localStorage.removeItem("reelSpec")}catch(e){} start(); setMsg("견본으로 되돌렸다."); };
window.addEventListener("hashchange", () => { SPEC = loadSpec(); start(); });

/* ───────── 5. 시작: 이미지 프리로드 후 재생 ───────── */
function start(){
  const S = render(SPEC);
  const all = [S.logo, S.mark, S.photos.hero, S.photos.people, ...(S.photos.strip||[]), ...S.depts.map(d=>d.img)].filter(Boolean);
  Promise.all([...new Set(all)].map(src => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = src; setTimeout(r, 4000); })))
    .then(() => playFrom(0));
}
start();
</script>
